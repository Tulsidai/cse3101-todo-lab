{% extends "tasks/layout.html" %}
{% block title %}Edit task{% endblock %}

{% block content %}
<h1>Edit task</h1>
<form method="post"  action="{% url 'task_edit' task.pk %}">
  {% csrf_token %}

  {{ form.as_p}}
  <button type="submit" >Save</button>
  <a href="{% url 'task_list' %}">Cancel</a>
</form>

{% endblock %}
