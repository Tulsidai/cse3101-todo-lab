<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Todo{% endblock %}</title>
    <style>
      body {
        font-family: Verdana, sans-serif;
        max-width: 800px;
        margin: 20px auto;
        padding: 0 10px;
        background-color: lavenderblush;
        overflow-wrap: break-word;
      }

      nav { padding-bottom: 10px; border-bottom: 2px solid hotpink }
      nav a {margin-right: 10px;}

      h1 {
        color:hotpink;
        font-family: Georgia, serif;
      }
      a { color: deeppink }
      button {
        background-color: hotpink;
        color: white;
        border: none;
        padding: 5px 12px;
        border-radius: 4px;
      }

      .errorlist {color: red;}
    </style>
  </head>

  <body>
    <nav>
      <a href='{% url "task_list" %}'>Tasks</a>
      <a href="{% url 'task_create' %}">New task</a>
    </nav>

    {% block content %}{% endblock %}
  </body>
</html>
